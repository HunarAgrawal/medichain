name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **do not include real patient data, keys or `.env` contents**.
        For security vulnerabilities, use a private security advisory instead (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, Smart contract, AI models / reports, Tooling and docs]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as Dr. Ananya Rao
        2. Open the draft for Tomás Okafor
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Backend log lines, browser console errors or screenshots. Remove anything sensitive.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Chrome 141, commit abc1234"
