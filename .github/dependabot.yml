# Weekly dependency updates, grouped so routine bumps arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1. Upgrade both projects together once it supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      contracts:
        update-types: [minor, patch]
    ignore:
      # Kept in step with the frontend's TypeScript version.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node types follow the Node 22 runtime used in CI.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
