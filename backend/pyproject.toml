[project]
name = "medichain-backend"
version = "0.3.0"
description = "Medichain API: role-based imaging studies, encrypted IPFS storage and an on-chain provenance and consent ledger."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "numpy>=2.0",
    "pillow>=11.0",
    "torch>=2.6",
    "transformers>=4.50,<6",
    "reportlab>=4.2",
    "cryptography>=44",
    "eth-account>=0.13",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
